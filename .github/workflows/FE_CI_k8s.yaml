name: Frontend CI (for K8s GitOps)

on:
  push:
    branches: [ "k8s" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push FE Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kube-fe:1.${{ github.run_number }}

  update-k8s-repo:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: minjae196
          repositories: k8s-config-repo

      - name: Checkout K8s Config Repo
        uses: actions/checkout@v4
        with:
          repository: 'minjae196/k8s-config-repo'
          token: ${{ steps.generate-token.outputs.token }}
          ref: main

      - name: Update values.yaml with new image tag
        run: |
          yq -i '.fe.image.tag = "1.${{ github.run_number }}"' chart/values.yaml
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add chart/values.yaml
          git commit -m "Update FE image tag to 1.${{ github.run_number }}"
          git push origin main

