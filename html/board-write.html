<!doctype html>
<html lang="kr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/config.js"></script>
    <title>게시글 작성</title>
    <link
            rel="stylesheet"
            href="../css/board-write.css"
            crossorigin="anonymous"
    />
</head>
<body>
<div class="wrap">
    <h2>게시글 작성</h2>
    <div class="inputBox">
        <label>제목*</label>
        <input
                type="text"
                id="title"
                placeholder="제목을 입력해 주세요. (최대 26자)"
        />
    </div>
    <div class="inputBox">
        <label>내용*</label>
        <textarea
                id="content"
                placeholder="내용을 입력해 주세요."
        ></textarea>
        <p class="helperText" name="content"></p>
    </div>
    <div class="inputBox">
        <label class="non-border">이미지</label>
        <input
                class="non-border"
                type="file"
                id="image"
                placeholder="파일을 선택해주세요."
                accept="image/jpeg,image/png"
        />
    </div>
    <div class="inputBox">
        <label class="non-border">영상</label>
        <input
                class="non-border"
                type="file"
                id="video"
                placeholder="영상 파일을 선택해주세요."
                accept="video/mp4,video/quicktime,video/x-msvideo,video/x-matroska,video/webm"
        />
        <p id="videoPreviewText" style="display:none; padding: 0 16px; font-size: 13px; color: #555;"></p>
        <div id="videoProgress" style="display:none; padding: 0 16px;">
            <div style="background: #e0e0e0; border-radius: 4px; height: 8px; overflow: hidden;">
                <div id="videoProgressBar" style="background: #7F6AEE; height: 100%; width: 0%; transition: width 0.3s;"></div>
            </div>
            <p id="videoProgressText" style="font-size: 12px; color: #888; margin-top: 4px;">0%</p>
        </div>
    </div>
    <button id="submit">완료</button>
</div>
<div class="background"></div>
</body>
<script src="../js/board-write.js" type="module"></script>
</html>
